# 本变更的 OpenSpec 局部配置
# schema 与 openspec/config.yaml 保持一致；本文件只声明本变更的元信息，不覆盖项目级配置。

project: CampusClaw
change: add-class-scoped-knowledge-search
capability: class-knowledge-search

# 目录约定（与项目级 config.yaml 一致）
changes_dir: openspec/changes
specs_dir: openspec/specs

# 变更状态：specified（规约完成，未实现）| implementing | verified | archived
status: specified

# 前置依赖（未满足时 MUST NOT 实施）
depends_on:
  - add-auth-rbac-class-knowledge

# 四件套产物路径（相对本变更目录）
artifacts:
  proposal: proposal.md
  design: design.md
  spec: specs/class-knowledge-search/spec.md
  tasks: tasks.md

# 交付纪律
rules:
  # 需求变化先改本变更 Markdown，再改代码
  spec_first: true
  # 未全部验收通过前不得归档到 openspec/specs
  archive_requires_all_passed: true
  # 未实施的任务保持 [ ]，不得预先勾选
  allow_prechecked_tasks: false
  # 每条任务必须带可执行 verify
  require_verify_per_task: true
