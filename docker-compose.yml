# CampusClaw 标准启动方式（规约 NFR-02 / A10 / A11）
#   cp .env.example .env   # 填写 SECRET_KEY（网关与向量库键见 .env.example）
#   docker compose up --build
services:
  app:
    build: .
    image: campusclaw:local
    container_name: campusclaw-app
    ports:
      - "8080:8080"
    # 会话签名密钥等只通过 env_file 注入，不写进镜像（NFR-01）
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/app.db
      UPLOAD_DIR: /app/uploads
      # 容器内指向同 compose 网络里的 qdrant 服务；.env 里若填了外部地址，
      # 把下面这行注释掉即可（environment 优先级高于 env_file）
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: campusclaw_chunks
    volumes:
      # down/up 后预置账号与已上传材料仍可查询（NFR-02 S3 / A11）
      - ./data:/app/data
      - ./uploads:/app/uploads
    depends_on:
      - qdrant
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  # 向量库。**它不是启动的必要条件**：不可达时 keyword 模式照常工作，
  # vector / hybrid 返回 503，应用不会因此起不来（spec §4 降级语义）。
  # 卷保留索引，使 `docker compose down && up` 后无需全量回填。
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: campusclaw-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
